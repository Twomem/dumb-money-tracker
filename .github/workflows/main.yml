name: Dumb Money Alpha Tracker

on:
  schedule:
    # Runs at minute 15 of every 3rd hour (Staggered to avoid peak GitHub traffic)
    - cron: '15 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Force sending a summary even if the latest video was already processed."
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Crucial for allowing the bot to save 'last_video.txt' back to your repo
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alpha Tracker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: python main.py

      - name: Commit and Push last_video.txt
        run: |
          git config --global user.name "AlphaTracker-Bot"
          git config --global user.email "actions@github.com"
          git add last_video.txt
          # Only commit if there are changes to avoid erroring
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update last processed video ID" && git push)
