name: Check Gemini API key

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/check-gemini.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Verify Gemini access without sending Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from google import genai
          from main import MODEL_NAME

          key = os.environ.get("GEMINI_API_KEY", "")
          if not key:
              raise SystemExit("GEMINI_API_KEY is missing or empty.")
          try:
              client = genai.Client(api_key=key)
              result = client.models.generate_content(
                  model=MODEL_NAME,
                  contents="Reply with the single word OK.",
                  config={
                      "max_output_tokens": 64,
                      "thinking_config": {"thinking_level": "low"},
                  },
              )
              if not result.text:
                  raise SystemExit("Gemini returned no text; validation incomplete.")
          except Exception as exc:
              print(f"Gemini access check failed: {str(exc).replace(key, '[REDACTED]')}")
              raise SystemExit(1)
          print(f"SUCCESS: GitHub secret authenticated and generated text with {MODEL_NAME}.")
          print("No Telegram sent. Billing tier is not exposed by this request.")
          PY
